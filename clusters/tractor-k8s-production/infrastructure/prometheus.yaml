---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-prometheus
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/prometheus
  prune: true
  wait: true
  patches:
    - "patch": |
        - "op": "replace"
          "path": "/spec/values/grafana/enabled"
          "value": true
        - "op": "replace"
          "path": "/spec/values/grafana/ingress/enabled"
          "value": true
        - "op": "add"
          "path": "/spec/values/grafana/ingress/hosts"
          "value":
          - "grafana.k8s.tractor.scout.ch"
        - "op": "replace"
          "path": "/spec/values/prometheus/ingress/enabled"
          "value": true
        - "op": "add"
          "path": "/spec/values/prometheus/ingress/hosts"
          "value":
          - "prometheus.k8s.tractor.scout.ch"
      "target":
        "kind": "HelmRelease"
        "name": "prometheus"
    
