#
# RBAC
#
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    toolkit.fluxcd.io/tenant: cosinus-ragflow
  
  annotations:
    scheduler.alpha.kubernetes.io/node-selector: kaas.infomaniak.cloud/instance-pool=pck-8kxhclv-pm8
  
  name: cosinus-ragflow
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    toolkit.fluxcd.io/tenant: cosinus-ragflow
  name: cosinus-ragflow
  namespace: cosinus-ragflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    toolkit.fluxcd.io/tenant: cosinus-ragflow
  name: gotk-reconciler
  namespace: cosinus-ragflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: cosinus-ragflow
    namespace: cosinus-ragflow

#
# Sync
#
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cosinus-ragflow
  namespace: cosinus-ragflow
spec:
  interval: 1h
  ref:
    branch: main
  secretRef:
    name: flux-git-deploy-key
  url: ssh://git@github.com/scout-ch/tractor-k8s-shared-cosinus-ragflow.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cosinus-ragflow
  namespace: cosinus-ragflow
spec:
  serviceAccountName: cosinus-ragflow
  interval: 10m0s
  path: .
  prune: true
  sourceRef:
    kind: GitRepository
    name: cosinus-ragflow
