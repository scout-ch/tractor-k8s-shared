---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-traefik-crds
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/traefik-crds
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-traefik
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure-gateway-api-crds
    - name: infrastructure-traefik-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/traefik
  prune: true
  wait: true
  patches:
    - target:
        kind: HelmRelease
      patch: |
        - op: add
          path: /spec/values/nodeSelector
          value:
            kaas.infomaniak.cloud/instance-pool: pck-8kxhclv-pdp
        - op: add
          path: /spec/values/service/spec/loadBalancerIP
          value: 37.156.40.230
        - op: add
          path: /spec/values/service/nameOverride
          value: traefik-tractor-k8s-shared
        - op: add
          path: /spec/values/providers/kubernetesGateway/statusAddress
          value:
            service:
              name: traefik-tractor-k8s-shared
        - op: add
          path: /spec/values/providers/kubernetesIngress
          value:
            publishedService:
              pathOverride: traefik/traefik-tractor-k8s-shared
