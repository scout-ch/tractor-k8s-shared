---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-traefik-crds
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/traefik-crds
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-traefik
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure-gateway-api-crds
    - name: infrastructure-traefik-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/traefik
  prune: true
  wait: true
  patches:
    - target:
        kind: Namespace
        name: traefik
      patch: |-
        - op: add
          path: /metadata/annotations/tractor.scout.ch~1instance-pool
          value: "pck-2tvwejg-pne"
    - target:
        kind: HelmRelease
      patch: |
        - op: add
          path: /spec/values/service/spec/loadBalancerIP
          value: 195.15.199.206
        - op: add
          path: /spec/values/service/nameOverride
          value: traefik-tractor-k8s-production
        - op: add
          path: /spec/values/providers/kubernetesGateway/statusAddress
          value:
            service:
              name: traefik-tractor-k8s-production
        - op: add
          path: /spec/values/providers/kubernetesIngress
          value:
            publishedService:
              pathOverride: traefik/traefik-tractor-k8s-production

        - op: add
          path: /spec/values/deployment
          value:
            replicas: 3
      

