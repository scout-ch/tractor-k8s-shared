---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-prometheus
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  path: ./infrastructure/prometheus
  prune: true
  wait: true
  patches:
    - "patch":
      - "op": "replace"
        "path": "/spec/values/grafana/enabled"
        "value": true
      "target":
        "kind": "HelmRelease"
        "name": "prometheus"
    
